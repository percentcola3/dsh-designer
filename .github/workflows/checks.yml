name: Package checks

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      release-tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate:
    name: Build, portable tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate release tag
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: node scripts/check-release.mjs
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build client from source
        run: npm run build
      - name: Portable regression tests
        run: |
          mkdir -p artifacts
          npm test > artifacts/tests.tap 2>&1 || { tail -n 160 artifacts/tests.tap; exit 1; }
          tail -n 12 artifacts/tests.tap
      - name: Validate runtime package
        run: npm run verify:package
      - name: Package and checksum
        run: npm run release:pack
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: artifacts/tests.tap
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload validated package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: designer-package
          path: |
            artifacts/*.tgz
            artifacts/SHA256SUMS
            artifacts/release.json
          if-no-files-found: error
          retention-days: 14
